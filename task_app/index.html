<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5B4CF5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="タスク管理">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: #5B4CF5;
      --primary-light: #EEF2FF;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --text: #111827;
      --text2: #6B7280;
      --border: #E5E7EB;
      --high: #EF4444;
      --mid: #F59E0B;
      --low: #22C55E;
      --radius: 14px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overscroll-behavior: none;
    }

    /* Install banner */
    #installBanner {
      display: none;
      background: var(--primary-light);
      padding: 10px 16px;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #C7D2FE;
    }
    #installBanner.show { display: flex; }
    #installBanner p { flex: 1; font-size: 0.82rem; color: #3730A3; line-height: 1.3; }
    #installBanner .btn-install {
      padding: 6px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    #installBanner .btn-dismiss {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 4px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--primary);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(91,76,245,0.3);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
    }

    /* Filter panel */
    .filter-panel {
      background: white;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, padding 0.3s ease;
      border-bottom: 1px solid var(--border);
    }
    .filter-panel.open { max-height: 220px; padding: 14px 16px; }
    .filter-row { margin-bottom: 10px; }
    .filter-row:last-child { margin-bottom: 0; }
    .filter-label { font-size: 0.72rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
    .filter-chips { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 0.78rem;
      cursor: pointer;
      color: var(--text2);
      font-weight: 500;
      transition: all 0.15s;
    }
    .chip.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }

    /* Main */
    main { padding: 14px 14px calc(90px + var(--safe-bottom)); }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: #E5E7EB;
      padding: 4px;
      border-radius: 10px;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--text2);
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab.active {
      background: white;
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--text2);
    }
    .empty .icon { font-size: 3.5rem; margin-bottom: 14px; }
    .empty p { font-size: 0.88rem; line-height: 1.6; }

    /* Task card */
    .task-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 9px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      transition: transform 0.1s;
    }
    .task-card:active { transform: scale(0.99); }
    .task-card.done { opacity: 0.55; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-top: 1px;
    }
    .task-check.checked { background: var(--primary); border-color: var(--primary); }
    .task-check.checked::after { content: '✓'; color: white; font-size: 12px; font-weight: 800; }

    .p-bar { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; min-height: 20px; }
    .p-bar.high { background: var(--high); }
    .p-bar.medium { background: var(--mid); }
    .p-bar.low { background: var(--low); }

    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 5px;
      word-break: break-word;
    }
    .task-card.done .task-title { text-decoration: line-through; color: var(--text2); }

    .task-meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: 600;
    }
    .b-due { background: #FEF3C7; color: #92400E; }
    .b-due.overdue { background: #FEE2E2; color: #991B1B; }
    .b-cat { background: var(--primary-light); color: #4338CA; }
    .b-tag { background: #F3F4F6; color: #374151; }

    .task-actions { display: flex; flex-direction: column; gap: 2px; }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      border-radius: 7px;
      font-size: 0.9rem;
      color: var(--text2);
      line-height: 1;
    }
    .action-btn:active { background: #F3F4F6; }

    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(91,76,245,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:active { transform: scale(0.92); box-shadow: 0 2px 8px rgba(91,76,245,0.3); }

    /* Modal overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      display: none;
      align-items: flex-end;
      backdrop-filter: blur(2px);
    }
    .overlay.open { display: flex; }

    /* Modal sheet */
    .modal {
      background: white;
      border-radius: 22px 22px 0 0;
      padding: 0 18px calc(28px + var(--safe-bottom));
      width: 100%;
      max-height: 92dvh;
      overflow-y: auto;
      animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.8; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: #D1D5DB;
      border-radius: 2px;
      margin: 12px auto 18px;
    }
    .modal h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 18px; }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-input {
      width: 100%;
      padding: 12px 13px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
      background: #FAFAFA;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none;
    }
    .form-input:focus { border-color: var(--primary); background: white; }

    .priority-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .p-btn {
      padding: 10px 6px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
      transition: all 0.15s;
      font-weight: 500;
      color: var(--text2);
    }
    .p-btn.sel-high { border-color: var(--high); background: #FEF2F2; color: var(--high); font-weight: 700; }
    .p-btn.sel-medium { border-color: var(--mid); background: #FFFBEB; color: #B45309; font-weight: 700; }
    .p-btn.sel-low { border-color: var(--low); background: #F0FDF4; color: #15803D; font-weight: 700; }

    .modal-footer { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 20px; }
    .btn-cancel {
      padding: 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: white;
      font-size: 0.92rem;
      cursor: pointer;
      color: var(--text2);
      font-weight: 500;
    }
    .btn-save {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (min-width: 600px) {
      main { max-width: 560px; margin: 0 auto; }
      .overlay { align-items: center; }
      .modal { border-radius: 22px; max-width: 480px; margin: auto; padding-bottom: 28px; }
      .fab { right: calc(50% - 260px); }
    }
  </style>
</head>
<body>

  <div id="installBanner">
    <p>📲 ホーム画面に追加するとアプリとして使えます</p>
    <button class="btn-install" onclick="installPWA()">追加</button>
    <button class="btn-dismiss" onclick="dismissInstall()">✕</button>
  </div>

  <header>
    <h1>📋 タスク管理</h1>
    <button class="header-btn" onclick="toggleFilter()">フィルタ ▾</button>
  </header>

  <div class="filter-panel" id="filterPanel">
    <div class="filter-row">
      <div class="filter-label">優先度</div>
      <div class="filter-chips">
        <button class="chip active" data-f="priority" data-v="">すべて</button>
        <button class="chip" data-f="priority" data-v="high">🔴 高</button>
        <button class="chip" data-f="priority" data-v="medium">🟡 中</button>
        <button class="chip" data-f="priority" data-v="low">🟢 低</button>
      </div>
    </div>
    <div class="filter-row">
      <div class="filter-label">カテゴリ</div>
      <div class="filter-chips" id="catChips">
        <button class="chip active" data-f="category" data-v="">すべて</button>
      </div>
    </div>
  </div>

  <main>
    <div class="tabs">
      <button class="tab active" onclick="setTab('active', this)">未完了</button>
      <button class="tab" onclick="setTab('done', this)">完了済み</button>
      <button class="tab" onclick="setTab('all', this)">すべて</button>
    </div>
    <div id="taskList"></div>
  </main>

  <button class="fab" onclick="openAdd()">＋</button>

  <div class="overlay" id="overlay" onclick="onOverlayClick(event)">
    <div class="modal" id="modal">
      <div class="modal-handle"></div>
      <h2 id="modalHeading">タスクを追加</h2>
      <form id="taskForm" onsubmit="saveTask(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label class="form-label">タイトル *</label>
          <input class="form-input" type="text" id="fTitle" placeholder="何をしますか？" required autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">優先度</label>
          <div class="priority-grid">
            <button type="button" class="p-btn" data-p="high" onclick="setPri('high')">🔴 高</button>
            <button type="button" class="p-btn sel-medium" data-p="medium" onclick="setPri('medium')">🟡 中</button>
            <button type="button" class="p-btn" data-p="low" onclick="setPri('low')">🟢 低</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">期限日</label>
          <input class="form-input" type="date" id="fDue">
        </div>
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <input class="form-input" type="text" id="fCat" placeholder="例: 仕事、プライベート" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">タグ (カンマ区切り)</label>
          <input class="form-input" type="text" id="fTags" placeholder="例: work, urgent, meeting" autocomplete="off">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" onclick="closeModal()">キャンセル</button>
          <button type="submit" class="btn-save">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tm_tasks') || '[]');
    let nextId = parseInt(localStorage.getItem('tm_nid') || '1');
    let tab = 'active';
    let filter = { priority: '', category: '' };
    let selPri = 'medium';
    let deferredPrompt = null;

    // PWA install
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('tm_install_dismissed')) {
        document.getElementById('installBanner').classList.add('show');
      }
    });
    async function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    }
    function dismissInstall() {
      localStorage.setItem('tm_install_dismissed', '1');
      document.getElementById('installBanner').classList.remove('show');
    }

    function persist() {
      localStorage.setItem('tm_tasks', JSON.stringify(tasks));
      localStorage.setItem('tm_nid', String(nextId));
    }

    function today() { return new Date().toISOString().split('T')[0]; }
    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      const prioOrd = { high: 0, medium: 1, low: 2 };
      let list = tasks.filter(t => {
        if (tab === 'active' && t.done) return false;
        if (tab === 'done' && !t.done) return false;
        if (filter.priority && t.priority !== filter.priority) return false;
        if (filter.category && t.category !== filter.category) return false;
        return true;
      }).sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const pd = (prioOrd[a.priority] ?? 1) - (prioOrd[b.priority] ?? 1);
        if (pd) return pd;
        return (a.due || '9999').localeCompare(b.due || '9999');
      });

      const el = document.getElementById('taskList');
      if (!list.length) {
        el.innerHTML = `<div class="empty"><div class="icon">📭</div><p>${tab === 'done' ? '完了済みのタスクはありません' : 'タスクがありません\n＋ボタンで追加しましょう'}</p></div>`;
        return;
      }

      el.innerHTML = list.map(t => {
        const od = t.due && t.due < today() && !t.done;
        const due = t.due ? `<span class="badge b-due${od ? ' overdue' : ''}">${od ? '⚠️ ' : '📅 '}${t.due}</span>` : '';
        const cat = t.category ? `<span class="badge b-cat">${esc(t.category)}</span>` : '';
        const tags = (t.tags || []).map(g => `<span class="badge b-tag">#${esc(g)}</span>`).join('');
        return `<div class="task-card${t.done ? ' done' : ''}">
          <div class="task-check${t.done ? ' checked' : ''}" onclick="toggle(${t.id})"></div>
          <div class="p-bar ${t.priority || 'medium'}"></div>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta">${due}${cat}${tags}</div>
          </div>
          <div class="task-actions">
            <button class="action-btn" onclick="openEdit(${t.id})">✏️</button>
            <button class="action-btn" onclick="del(${t.id})">🗑️</button>
          </div>
        </div>`;
      }).join('');

      // Update category chips
      const cats = [...new Set(tasks.map(t => t.category).filter(Boolean))];
      const cc = document.getElementById('catChips');
      const allChip = cc.children[0];
      cc.innerHTML = '';
      cc.appendChild(allChip);
      cats.forEach(c => {
        const b = document.createElement('button');
        b.className = 'chip' + (filter.category === c ? ' active' : '');
        b.dataset.f = 'category';
        b.dataset.v = c;
        b.textContent = c;
        b.onclick = () => setFilter('category', c);
        cc.appendChild(b);
      });
      allChip.className = 'chip' + (filter.category === '' ? ' active' : '');
    }

    function toggle(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; persist(); render(); }
    }

    function del(id) {
      if (!confirm('このタスクを削除しますか？')) return;
      tasks = tasks.filter(t => t.id !== id);
      persist(); render();
    }

    function setTab(t, btn) {
      tab = t;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function toggleFilter() {
      document.getElementById('filterPanel').classList.toggle('open');
    }

    function setFilter(type, val) {
      filter[type] = filter[type] === val ? '' : val;
      document.querySelectorAll(`[data-f="${type}"]`).forEach(b => {
        b.classList.toggle('active', b.dataset.v === filter[type]);
      });
      render();
    }

    document.querySelectorAll('[data-f]').forEach(b => {
      b.addEventListener('click', () => setFilter(b.dataset.f, b.dataset.v));
    });

    // Modal
    function openAdd() {
      document.getElementById('editId').value = '';
      document.getElementById('modalHeading').textContent = 'タスクを追加';
      document.getElementById('taskForm').reset();
      setPri('medium');
      openModal();
      setTimeout(() => document.getElementById('fTitle').focus(), 100);
    }

    function openEdit(id) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      document.getElementById('editId').value = id;
      document.getElementById('modalHeading').textContent = 'タスクを編集';
      document.getElementById('fTitle').value = t.title;
      document.getElementById('fDue').value = t.due || '';
      document.getElementById('fCat').value = t.category || '';
      document.getElementById('fTags').value = (t.tags || []).join(', ');
      setPri(t.priority || 'medium');
      openModal();
    }

    function openModal() { document.getElementById('overlay').classList.add('open'); }
    function closeModal() { document.getElementById('overlay').classList.remove('open'); }
    function onOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

    function setPri(p) {
      selPri = p;
      document.querySelectorAll('.p-btn').forEach(b => {
        b.className = 'p-btn' + (b.dataset.p === p ? ` sel-${p}` : '');
      });
    }

    function saveTask(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const title = document.getElementById('fTitle').value.trim();
      const due = document.getElementById('fDue').value || null;
      const category = document.getElementById('fCat').value.trim() || null;
      const tags = document.getElementById('fTags').value.split(',').map(s => s.trim()).filter(Boolean);

      if (id) {
        const t = tasks.find(t => t.id === parseInt(id));
        if (t) Object.assign(t, { title, due, category, tags, priority: selPri });
      } else {
        tasks.push({ id: nextId++, title, done: false, priority: selPri, due, category, tags, createdAt: new Date().toISOString() });
      }

      persist(); render(); closeModal();
    }

    // Init
    render();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
